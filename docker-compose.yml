services:
  postgres:
    image: postgres:17-alpine
    container_name: cda-poc-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: cda_poc
      POSTGRES_USER: cda_poc_user
      POSTGRES_PASSWORD: cda_poc_password

    ports:
      - "5432:5432"

    volumes:
      - cda_poc_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cda_poc_user -d cda_poc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cda_poc_postgres_data: